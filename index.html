<title>Modal Quiz</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #151922;
    --muted: #747b88;
    --border: #e7e9ee;
    --primary: #111827;
    --primary-hover: #1f2937;
    --green: #15803d;
    --green-bg: #ecfdf3;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* =========================
   SCREENS
========================= */

.screen {
    min-height: 100vh;
    width: 100%;
}

.hidden {
    display: none !important;
}

/* =========================
   MENU
========================= */

#menuScreen {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 18px;
}

.menu-wrapper {
    width: 100%;
    max-width: 720px;
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo-small {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
}

.logo h1 {
    font-size: clamp(38px, 7vw, 62px);
    line-height: 1;
    letter-spacing: -3px;
}

.logo p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 16px;
}

.menu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 32px;
    box-shadow: var(--shadow);
}

.section {
    margin-bottom: 28px;
}

.section:last-child {
    margin-bottom: 0;
}

.section-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
}

.options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.option {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 14px;
    min-height: 52px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .18s ease;
}

.option:hover {
    border-color: #b9bec8;
    transform: translateY(-1px);
}

.option.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.hint-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px 17px;
}

.hint-info strong {
    display: block;
    font-size: 15px;
    margin-bottom: 3px;
}

.hint-info span {
    color: var(--muted);
    font-size: 13px;
}

.switch {
    width: 52px;
    height: 30px;
    background: #d9dde5;
    border-radius: 30px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
}

.switch::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    top: 3px;
    left: 3px;
    background: white;
    border-radius: 50%;
    transition: .2s;
    box-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.switch.active {
    background: var(--primary);
}

.switch.active::after {
    transform: translateX(22px);
}

.start-btn {
    width: 100%;
    height: 58px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: .18s;
    margin-top: 5px;
}

.start-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

/* =========================
   QUIZ
========================= */

#quizScreen {
    padding: 25px 18px;
}

.quiz-wrapper {
    max-width: 850px;
    margin: 0 auto;
}

.quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.quiz-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
}

.score {
    font-size: 14px;
    font-weight: 800;
}

.progress {
    height: 7px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width .3s ease;
}

.quiz-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: clamp(25px, 5vw, 50px);
}

.question-number {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 18px;
}

.question {
    font-size: clamp(23px, 4vw, 34px);
    line-height: 1.25;
    letter-spacing: -.7px;
    font-weight: 800;
    margin-bottom: 28px;
}

.answer-box {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 17px;
    font: inherit;
    font-size: 16px;
    outline: none;
    background: #fafbfc;
    transition: .18s;
}

.answer-box:focus {
    border-color: #9ca3af;
    background: white;
    box-shadow: 0 0 0 4px rgba(17,24,39,.05);
}

.hint-box {
    margin-top: 15px;
    padding: 14px 16px;
    border-radius: 14px;
    background: #f6f7f9;
    color: #555c68;
    font-size: 14px;
    line-height: 1.5;
    display: none;
}

.hint-box.visible {
    display: block;
}

.quiz-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
}

.hint-btn,
.check-btn,
.next-btn {
    border: 0;
    border-radius: 14px;
    min-height: 50px;
    padding: 0 20px;
    font-weight: 800;
    cursor: pointer;
    font-size: 14px;
}

.hint-btn {
    background: #f0f2f5;
    color: #303641;
}

.check-btn,
.next-btn {
    background: var(--primary);
    color: white;
    margin-left: auto;
}

.feedback {
    margin-top: 20px;
    padding: 18px;
    border-radius: 17px;
    display: none;
}

.feedback.correct {
    display: block;
    background: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: #166534;
}

.feedback.incorrect {
    display: block;
    background: var(--red-bg);
    border: 1px solid #fecaca;
    color: #991b1b;
}

.feedback-title {
    font-weight: 900;
    margin-bottom: 8px;
}

.feedback-answer {
    font-size: 14px;
    line-height: 1.5;
}

/* =========================
   RESULTS
========================= */

#resultsScreen {
    padding: 30px 18px;
}

.results-wrapper {
    max-width: 850px;
    margin: 0 auto;
}

.result-header {
    background: white;
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 45px 30px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
}

.result-header h1 {
    font-size: 38px;
    letter-spacing: -1.5px;
}

.result-score {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: -3px;
    margin: 10px 0;
}

.result-percent {
    color: var(--muted);
    font-size: 15px;
}

.review {
    background: white;
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
}

.review-title {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    font-weight: 900;
}

.review-item {
    padding: 22px 24px;
    border-bottom: 1px solid var(--border);
}

.review-item:last-child {
    border-bottom: 0;
}

.review-question {
    font-weight: 800;
    margin-bottom: 13px;
    line-height: 1.45;
}

.review-row {
    font-size: 14px;
    line-height: 1.6;
    margin-top: 6px;
}

.review-label {
    font-weight: 800;
}

.correct-text {
    color: var(--green);
}

.incorrect-text {
    color: var(--red);
}

.result-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.result-actions button {
    flex: 1;
    height: 52px;
    border: 0;
    border-radius: 15px;
    font-weight: 800;
    cursor: pointer;
}

.again-btn {
    background: var(--primary);
    color: white;
}

.menu-btn {
    background: white;
    border: 1px solid var(--border) !important;
    color: var(--text);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .menu-card {
        padding: 22px;
        border-radius: 22px;
    }

    .options {
        grid-template-columns: repeat(2, 1fr);
    }

    .quiz-card {
        border-radius: 22px;
        padding: 24px 19px;
    }

    .question {
        font-size: 25px;
    }

    .quiz-actions {
        flex-wrap: wrap;
    }

    .hint-btn,
    .check-btn,
    .next-btn {
        flex: 1;
        margin-left: 0;
    }

    .result-actions {
        flex-direction: column;
    }
}
</style>
</head>

/* =========================================================
   ZMIENNE
========================================================= */

let selectedDifficulty = "easy";
let selectedCount = 1;
let showHints = true;

let quizQuestions = [];
let currentQuestion = 0;
let score = 0;

let results = [];


/* =========================================================
   ELEMENTY
========================================================= */

const menuScreen = document.getElementById("menuScreen");
const quizScreen = document.getElementById("quizScreen");
const resultsScreen = document.getElementById("resultsScreen");

const startBtn = document.getElementById("startBtn");

const questionCounter = document.getElementById("questionCounter");
const questionNumber = document.getElementById("questionNumber");
const questionText = document.getElementById("questionText");

const answerInput = document.getElementById("answerInput");

const scoreDisplay = document.getElementById("scoreDisplay");
const progressBar = document.getElementById("progressBar");

const hintBox = document.getElementById("hintBox");
const hintBtn = document.getElementById("hintBtn");
const hintSwitch = document.getElementById("hintSwitch");

const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");

const feedback = document.getElementById("feedback");
const feedbackTitle = document.getElementById("feedbackTitle");
const feedbackAnswer = document.getElementById("feedbackAnswer");

const resultScore = document.getElementById("resultScore");
const resultPercent = document.getElementById("resultPercent");
const reviewList = document.getElementById("reviewList");

const againBtn = document.getElementById("againBtn");
const menuBtn = document.getElementById("menuBtn");


/* =========================================================
   WYBÓR POZIOMU
========================================================= */

document.querySelectorAll("[data-difficulty]").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll("[data-difficulty]")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        selectedDifficulty = button.dataset.difficulty;

    });

});


/* =========================================================
   WYBÓR LICZBY PYTAŃ
========================================================= */

document.querySelectorAll("[data-count]").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll("[data-count]")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        selectedCount = Number(button.dataset.count);

    });

});


/* =========================================================
   PODPOWIEDŹ W MENU
========================================================= */

hintSwitch.addEventListener("click", () => {

    showHints = !showHints;

    hintSwitch.classList.toggle("active", showHints);

});


/* =========================================================
   START QUIZU
========================================================= */

startBtn.addEventListener("click", startQuiz);

function startQuiz() {

    const pool = questions[selectedDifficulty];

    if (!pool || pool.length === 0) {

        alert("Brak pytań dla tego poziomu. Wklej najpierw swoją bazę pytań.");

        return;
    }

    const shuffled = [...pool].sort(() => Math.random() - 0.5);

    if (selectedCount === 1) {

        quizQuestions = [shuffled[0]];

    } else {

        quizQuestions = shuffled.slice(
            0,
            Math.min(selectedCount, shuffled.length)
        );

    }

    currentQuestion = 0;
    score = 0;
    results = [];


    /*
       NAJWAŻNIEJSZE:
       MENU ZNIKA CAŁKOWICIE.
    */

    menuScreen.classList.add("hidden");

    resultsScreen.classList.add("hidden");

    quizScreen.classList.remove("hidden");

    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;

    loadQuestion();

}


/* =========================================================
   WCZYTANIE PYTANIA
========================================================= */

function loadQuestion() {

    const q = quizQuestions[currentQuestion];

    answerInput.value = "";

    answerInput.disabled = false;

    questionCounter.textContent =
        `Pytanie ${currentQuestion + 1} z ${quizQuestions.length}`;

    questionNumber.textContent =
        `Pytanie ${String(currentQuestion + 1).padStart(2, "0")}`;

    questionText.textContent = q.q;

    scoreDisplay.textContent =
        `Wynik: ${score}`;

    const progress =
        ((currentQuestion) / quizQuestions.length) * 100;

    progressBar.style.width = `${progress}%`;


    /* PODPOWIEDŹ */

    hintBox.textContent = q.h || "Brak podpowiedzi.";

    hintBox.classList.remove("visible");

    if (showHints) {

        hintBtn.classList.remove("hidden");

    } else {

        hintBtn.classList.add("hidden");

    }


    /* FEEDBACK */

    feedback.className = "feedback";

    feedbackTitle.textContent = "";

    feedbackAnswer.textContent = "";


    checkBtn.classList.remove("hidden");

    nextBtn.classList.add("hidden");

}


/* =========================================================
   PODPOWIEDŹ
========================================================= */

hintBtn.addEventListener("click", () => {

    hintBox.classList.toggle("visible");

    if (hintBox.classList.contains("visible")) {

        hintBtn.textContent = "Ukryj podpowiedź";

    } else {

        hintBtn.textContent = "Pokaż podpowiedź";

    }

});


/* =========================================================
   NORMALIZACJA
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:"]/g, "")
        .replace(/\s+/g, " ");

}


/* =========================================================
   SPRAWDZANIE
========================================================= */

checkBtn.addEventListener("click", checkAnswer);

function checkAnswer() {

    const q = quizQuestions[currentQuestion];

    const userAnswer = answerInput.value.trim();

    if (!userAnswer) {

        alert("Najpierw wpisz odpowiedź.");

        return;
    }

    const normalizedUser = normalize(userAnswer);

    const correctAnswers = Array.isArray(q.a)
        ? q.a
        : [q.a];

    const isCorrect = correctAnswers.some(answer =>
        normalize(answer) === normalizedUser
    );


    if (isCorrect) {

        score++;

        feedback.className = "feedback correct";

        feedbackTitle.textContent = "✓ Poprawna odpowiedź";

        feedbackAnswer.innerHTML =
            `<strong>Twoja odpowiedź:</strong> ${escapeHTML(userAnswer)}`;

    } else {

        feedback.className = "feedback incorrect";

        feedbackTitle.textContent = "✕ Niepoprawna odpowiedź";

        feedbackAnswer.innerHTML =
            `<strong>Twoja odpowiedź:</strong> ${escapeHTML(userAnswer)}
            <br>
            <strong>Poprawna odpowiedź:</strong> ${escapeHTML(correctAnswers[0])}`;

    }


    results.push({

        question: q.q,

        userAnswer: userAnswer,

        correctAnswer: correctAnswers[0],

        correct: isCorrect

    });


    answerInput.disabled = true;

    checkBtn.classList.add("hidden");

    nextBtn.classList.remove("hidden");

    scoreDisplay.textContent =
        `Wynik: ${score}`;

}


/* =========================================================
   NASTĘPNE PYTANIE
========================================================= */

nextBtn.addEventListener("click", nextQuestion);

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= quizQuestions.length) {

        showResults();

        return;
    }

    loadQuestion();

    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;

}


/* =========================================================
   WYNIKI
========================================================= */

function showResults() {

    quizScreen.classList.add("hidden");

    menuScreen.classList.add("hidden");

    resultsScreen.classList.remove("hidden");

    progressBar.style.width = "100%";

    resultScore.textContent =
        `${score} / ${quizQuestions.length}`;

    const percentage =
        Math.round((score / quizQuestions.length) * 100);

    resultPercent.textContent =
        `${percentage}% poprawnych odpowiedzi`;


    reviewList.innerHTML = "";


    results.forEach((result, index) => {

        const item = document.createElement("div");

        item.className = "review-item";

        item.innerHTML = `

            <div class="review-question">
                ${index + 1}. ${escapeHTML(result.question)}
            </div>

            <div class="review-row">
                <span class="review-label">Twoja odpowiedź:</span>
                <span class="${result.correct ? "correct-text" : "incorrect-text"}">
                    ${escapeHTML(result.userAnswer)}
                </span>
            </div>

            <div class="review-row">
                <span class="review-label">Poprawna odpowiedź:</span>
                <span class="correct-text">
                    ${escapeHTML(result.correctAnswer)}
                </span>
            </div>

        `;

        reviewList.appendChild(item);

    });

}


/* =========================================================
   ZAGRAJ PONOWNIE
========================================================= */

againBtn.addEventListener("click", () => {

    resultsScreen.classList.add("hidden");

    startQuiz();

});


/* =========================================================
   MENU GŁÓWNE
========================================================= */

menuBtn.addEventListener("click", () => {

    quizScreen.classList.add("hidden");

    resultsScreen.classList.add("hidden");

    menuScreen.classList.remove("hidden");

    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;

});


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CTRL + ENTER
========================================================= */

answerInput.addEventListener("keydown", event => {

    if (event.ctrlKey && event.key === "Enter") {

        if (!checkBtn.classList.contains("hidden")) {

            checkAnswer();

        } else {

            nextQuestion();

        }

    }

});
